schema_version: 1

context:
  version: "2026.9.1"
  python_min: '3.10'

package:
  name: scikit-hep
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/scikit-hep/scikit_hep-${{ version }}.tar.gz
  sha256: 10c3511ae1ed8fde505e76d843266b4ef1a1dfb64e829ba8f95a20c9bcba21ad

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools >=62.6
  run:
    - python >=${{ python_min }}
    - awkward ~=2.13.0
    - decaylanguage ~=1.1.0
    - hepstats ~=0.10.0
    - hepunits ~=2.4.0
    - hist ~=2.11.0
    - histoprint ~=2.7.0
    - iminuit ~=2.32.0
    - matplotlib-base >3.4.0
    - mplhep ~=1.2.0
    - numpy >=1.13.1
    - particle ~=1.0.0
    - pylhe ~=2.0.0
    - resample ~=1.10.0
    - uproot ~=5.7.0
    - vector ~=1.8.0

tests:
  - python:
      imports:
        - skhep
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Metapackage of Scikit-HEP project tools for Particle Physics.
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/scikit-hep/scikit-hep/
  repository: https://github.com/scikit-hep/scikit-hep/

extra:
  recipe-maintainers:
    - matthewfeickert
    - chrisburr
    - eduardo-rodrigues
    - henryiii
